{{/* 列表项：日期 + 标题 + 栏目。参数：页面列表 */}}
<ul class="postlist">
  {{ range . }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01-02" }}</time>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Parent }}{{ if .IsSection }}<span class="chip">{{ .Title }}</span>{{ end }}{{ end }}
  </li>
  {{ end }}
</ul>
