  - name: books
    label: 文库 · 书目
    label_singular: 书
    description: "新增或修改一部书的封面、简介、状态；书里的文章在各自的栏目里写"
    folder: content/wenku
    create: true
    extension: md
    format: frontmatter
    path: "{{slug}}/_index"
    slug: {template: "book-{{year}}{{month}}{{day}}", editable: true}
    sortable_fields: [weight, title]
    summary: "{{title}}"
    fields:
      - {label: 书名, name: title, widget: string}
      - {label: 副标题, name: subtitle, widget: string, required: false, hint: "如：随笔集、中短篇小说集、长篇小说"}
      - {label: 一句话简介, name: description, widget: string, required: false}
      - {label: 类别, name: form, widget: select, options: ["文集", "长篇", "中篇"], default: "文集", hint: "决定在文库书架上放在哪一组"}
      - {label: 状态, name: status, widget: select, options: ["整理中", "连载中", "已完结"], default: "整理中"}
      - {label: 篇章单位, name: unit, widget: select, options: ["篇", "章", "回"], default: "篇", hint: "文集用“篇”，长篇用“章”"}
      - {label: 目录按顺序号排, name: ordered, widget: boolean, default: true}
      - {label: 目录前显示一、二、三, name: numbered, widget: boolean, default: false, hint: "长篇建议打开"}
      - {label: 书架上的顺序, name: weight, widget: number, value_type: int, min: 1, hint: "同一类别里，数字小的排前面"}
      - {label: 封面, name: cover, widget: image, required: false}
      - {label: 版式, name: layout, widget: hidden, default: "book"}
      - {label: 序言, name: body, widget: markdown, required: false, hint: "显示在封面和目录之间，可留空"}

  - name: zhaji
    label: 札记
    label_singular: 札记
    description: "短小的片段，几行就停"
    folder: content/zhaji
    create: true
    extension: md
    format: frontmatter
    path: "{{slug}}/index"
    slug: {template: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}", editable: false}
    sortable_fields: [date]
    summary: "{{date}}  {{body}}"
    fields:
      - {label: 标题, name: title, widget: string, required: false, hint: "可以不写。写了会显示在这条札记正文的上方"}
      - {label: 时间, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ"}
      - {label: 标签, name: tags, widget: list, required: false}
      - {label: 草稿, name: draft, widget: boolean, default: false}
      - {label: 正文, name: body, widget: markdown}

  - name: pages
    label: 站点页面
    description: "首页简介、关于等"
    files:
      - name: home
        label: 首页简介
        file: content/_index.md
        fields:
          - {label: 站名, name: title, widget: string}
          - {label: 首页大标题, name: heading, widget: string, required: false, hint: "留空则显示站名"}
          - {label: 简介正文, name: body, widget: markdown}
      - name: about
        label: 关于
        file: content/about.md
        fields:
          - {label: 标题, name: title, widget: string}
          - {label: 正文, name: body, widget: markdown}
      - name: links
        label: 友链
        file: content/links.md
        fields:
          - {label: 标题, name: title, widget: string}
          - {label: 正文, name: body, widget: markdown}
